<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Supply Chain — Project Progress</title>
<style>
:root{color-scheme:light;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#fff}*{box-sizing:border-box}body{margin:0;padding:18px}.widget{max-width:850px;margin:auto;border:1px solid #e6e6e6;border-radius:16px;padding:22px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#747474}.heading{font-size:21px;font-weight:650;letter-spacing:-.025em;margin:6px 0 0}.sample{border:1px solid #dedede;border-radius:99px;padding:6px 9px;font-size:11px;color:#666;white-space:nowrap}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:22px 0}.metric{background:#f7f7f7;border-radius:12px;padding:15px}.value{font-size:30px;font-weight:680;letter-spacing:-.04em;font-variant-numeric:tabular-nums}.label{font-size:12px;color:#686868;margin-top:4px}.progresshead{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:9px}.bar{height:10px;background:#ededed;border-radius:20px;overflow:hidden}.fill{height:100%;background:#171717;border-radius:20px;width:0;transition:width .25s}.foot{font-size:11px;color:#858585;margin:13px 0 0}@media(max-width:460px){body{padding:8px}.widget{padding:16px}.heading{font-size:17px}.metrics{gap:7px}.metric{padding:11px}.value{font-size:23px}.label{font-size:11px}}
</style>
</head>
<body>
<main class="widget" aria-label="Supply Chain Specialization project progress">
  <div class="top"><div><div class="eyebrow">Project dashboard</div><h1 class="heading">Supply Chain Specialization</h1></div><span class="sample">Sample data</span></div>
  <div class="metrics"><div class="metric"><div class="value" id="total">12</div><div class="label">Total deliverables</div></div><div class="metric"><div class="value" id="completed">8</div><div class="label">Completed</div></div><div class="metric"><div class="value" id="percent">67%</div><div class="label">Overall progress</div></div></div>
  <div class="progresshead"><span>Deliverable completion</span><span id="ratio">8 of 12</span></div><div class="bar" role="progressbar" aria-label="Deliverables completed" aria-valuemin="0" aria-valuemax="100" aria-valuenow="67" id="bar"><div class="fill" id="fill"></div></div>
  <p class="foot">Illustrative figures only. This widget does not automatically sync with xTiles.</p>
</main>
<script>
// Edit these two numbers to update the widget, then republish the file.
const TOTAL_DELIVERABLES = 12;
const COMPLETED_DELIVERABLES = 8;
const total = Math.max(0, Math.floor(Number(TOTAL_DELIVERABLES)||0));
const completed = Math.min(total, Math.max(0, Math.floor(Number(COMPLETED_DELIVERABLES)||0)));
const pct = total ? Math.round(completed/total*100) : 0;
document.getElementById('total').textContent=total;
document.getElementById('completed').textContent=completed;
document.getElementById('percent').textContent=pct+'%';
document.getElementById('ratio').textContent=completed+' of '+total;
document.getElementById('fill').style.width=pct+'%';
document.getElementById('bar').setAttribute('aria-valuenow',String(pct));
</script>
</body></html>
